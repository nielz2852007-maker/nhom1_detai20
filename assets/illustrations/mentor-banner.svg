<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Minh họa cố vấn và học viên trao đổi">
  <defs>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f9ff"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="360" cy="120" r="120" fill="url(#halo)" opacity="0.9"/>
  <circle cx="95" cy="275" r="74" fill="#a5f3fc" opacity="0.35"/>
  <circle cx="430" cy="300" r="36" fill="#ddd6fe" opacity="0.7"/>

  <g filter="url(#shadow)">
    <rect x="150" y="88" width="240" height="152" rx="16" fill="#ffffff"/>
    <rect x="164" y="102" width="212" height="120" rx="10" fill="url(#screen)"/>
    <rect x="180" y="122" width="92" height="9" rx="4.5" fill="#ffffff" opacity="0.9"/>
    <rect x="180" y="142" width="150" height="8" rx="4" fill="#ffffff" opacity="0.55"/>
    <rect x="180" y="160" width="120" height="8" rx="4" fill="#ffffff" opacity="0.55"/>
    <rect x="180" y="178" width="164" height="8" rx="4" fill="#ffffff" opacity="0.4"/>
    <rect x="180" y="196" width="82" height="8" rx="4" fill="#ffffff" opacity="0.4"/>
    <rect x="130" y="240" width="280" height="14" rx="7" fill="#cbd5e1"/>
    <rect x="215" y="254" width="110" height="8" rx="4" fill="#94a3b8"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="118" cy="148" r="32" fill="#fef3c7" stroke="#ffffff" stroke-width="6"/>
    <text x="118" y="159" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#b45309">M</text>
  </g>
  <g filter="url(#shadow)">
    <circle cx="404" cy="222" r="30" fill="#dbeafe" stroke="#ffffff" stroke-width="6"/>
    <text x="404" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1d4ed8">S</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="296" y="34" width="140" height="60" rx="18" fill="url(#bubble)"/>
    <path d="M330 94 L330 108 L350 94 Z" fill="#ffffff"/>
    <text x="366" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4338ca">Trao đổi cùng mentor</text>
  </g>

  <g fill="#f59e0b">
    <path d="M70 92 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path d="M445 150 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" opacity="0.8"/>
    <path d="M245 54 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" opacity="0.7"/>
  </g>
</svg>
