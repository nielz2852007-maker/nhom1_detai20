<!DOCTYPE html>
<html lang="vi">
<head>
  <!-- Khai báo tiếng Việt và tối ưu hiển thị trên điện thoại -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MentorConnect - Hồ sơ cố vấn</title>

  <!-- Nạp stylesheet chung trước, sau đó nạp stylesheet riêng cho trang hồ sơ -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>
  <!-- Phần đầu trang và thanh điều hướng -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">MentorConnect</a>
      <button class="menu-toggle" id="menu-toggle" aria-label="Bật tắt menu">☰</button>
      <nav class="nav" id="nav">
        <a href="index.html">Trang chủ</a>
        <a href="index2.html">Hồ sơ cố vấn</a>
        <a href="index3.html">Lịch hẹn</a>
      </nav>
    </div>
  </header>

  <!-- Nội dung chính: hồ sơ cố vấn, lịch rảnh và đánh giá do JavaScript đổ dữ liệu -->
  <main class="container" id="profile-root">
    <!-- Thông tin tổng quan của cố vấn -->
    <section class="card profile-head">
      <div class="avatar avatar-lg" id="mentor-avatar"></div>
      <div>
        <h1 id="mentor-name"></h1>
        <p class="rating" id="mentor-rating"></p>
        <p class="bio" id="mentor-bio"></p>
        <div class="tags" id="mentor-skills"></div>
      </div>
    </section>

    <!-- Danh sách khung giờ rảnh và nút đặt lịch -->
    <section class="card section">
      <h2>Lịch rảnh</h2>
      <div class="slot-list" id="slot-list"></div>
      <button class="btn btn-primary" id="book-btn">Đặt lịch hẹn</button>
    </section>

    <!-- Danh sách đánh giá từ người học -->
    <section class="card section">
      <h2>Đánh giá</h2>
      <div id="review-list"></div>
    </section>
  </main>

  <!-- Hộp thoại xác nhận đặt lịch hẹn -->
  <div class="modal" id="confirm-modal">
    <div class="modal-box card">
      <h2>Xác nhận đặt lịch</h2>
      <p id="confirm-text"></p>
      <div class="modal-actions">
        <button class="btn btn-danger" id="cancel-btn">Hủy</button>
        <button class="btn btn-primary" id="confirm-btn">Xác nhận</button>
      </div>
    </div>
  </div>

  <!-- Phần chân trang -->
  <footer class="site-footer">
    <div class="container">© 2026 MentorConnect. Cổng kết nối Cố vấn &amp; Học nhóm.</div>
  </footer>

  <!-- Nạp các tệp JavaScript theo đúng thứ tự -->
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
