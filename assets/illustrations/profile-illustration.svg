<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="Minh họa hồ sơ cố vấn với đánh giá và kỹ năng">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <circle cx="110" cy="110" r="96" fill="url(#card)" opacity="0.85"/>

  <g filter="url(#soft)">
    <rect x="52" y="46" width="116" height="126" rx="16" fill="#ffffff"/>
    <circle cx="110" cy="88" r="24" fill="#e0e7ff"/>
    <text x="110" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#4338ca">M</text>
    <rect x="76" y="122" width="68" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="88" y="140" width="44" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="68" y="158" width="32" height="14" rx="7" fill="#eef2ff"/>
    <rect x="106" y="158" width="32" height="14" rx="7" fill="#eef2ff"/>
  </g>

  <g filter="url(#soft)">
    <rect x="126" y="30" width="72" height="42" rx="14" fill="#ffffff"/>
    <text x="162" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#b45309">★ 4.9</text>
  </g>

  <g fill="#06b6d4">
    <circle cx="38" cy="150" r="7"/>
    <circle cx="182" cy="170" r="6" opacity="0.7"/>
  </g>
</svg>
